<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment- Pseudo class</title>
    <style>
        .hover_btn{
            background-color: pink;
            color: black;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .hover_btn:hover{
            background-color: black;
            color: pink;
        }

        nav a{
            color: blue;
            margin: 20px;
        }

        nav a:active{
            color: red;
        }

        nav a:visited{
            color: orange;
        }

        .focus_input{
            padding: 10px;
            border: 2px solid gray;
        }

        .focus_input:focus{
            border-color: green;
            outline: none;
        }

        .my_list li:nth-child(even){
            background-color: lightskyblue;
        }

        .email_input{
            padding: 10px;
        }

        .email_input:invalid{
            border: 2px solid red;
        }

        .submit_btn{
            padding: 10px 20px;
        }
        
        table tr:nth-child(odd){
            background-color: lightpink;
        }

        table tr:nth-child(even){
            background-color: lightsalmon;
        }
    </style>
</head>
<body>
    <h2>1. Hover Button</h2>
    <button class="hover_btn">Hover me</button>

    <h2>2. Navigation Menu</h2>
    <nav>
        <a href="https://web.telegram.org/a/">Telegram</a>
        <a href="https://www.facebook.com/">Facebook</a>
        <a href="https://dribbble.com/">Dribbble</a>
    </nav>

    <h2>3. Focus Input</h2>
    <input type="text" class="focus_input" placeholder="Click inside me"/>

    <h2>4. List</h2>
    <ul class="my_list">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Grapes</li>
        <li>Orange</li>
    </ul>

    <h2>5. Invalid Input</h2>
    <form>
        <input type="email" class="email_input" id="email" placeholder="Enter your email" required/>
        <button class="submit_btn" type="submit">Submit</button>
    </form>

    <h2>6. Table</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Jenna</td>
            <td>94</td>
        </tr>
        <tr>
            <td>James</td>
            <td>89</td>
        </tr>
        <tr>
            <td>Jay</td>
            <td>92</td>
        </tr>
        <tr>
            <td>Jerry</td>
            <td>95</td>
        </tr>
    </table>
</body>
</html>
