<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: yellow;
            color: #000000;
        }

        input {
            padding: 10px;
            border: 1px solid black;
        }

        input:focus{
            outline: none;
            border: 2px solid blue;
        }

        li:first-child {
            color: red;
        }

        li:last-child{
            color: purple;
        }

        a {
            color: green;
            text-decoration: none;
        }

        a:visited {
            color: rgb(218, 47, 47);
        }

        a:active {
            color: aqua;
        }

        .text:hover{
            color: darkorchid
        }
    </style>
</head>
<body>

    <button>Click me</button>
    <input type="text" name="" id=""/>

    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    <a href="https://kr.pinterest.com/">Click here to open Pinterest</a>

    <p class="text">Hover over this text</p>
    
</body>
</html>
