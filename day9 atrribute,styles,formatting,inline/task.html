<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table color task</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: separate;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Number</th>
            <th>Name</th>
            <th>Age</th>
        </tr>

        <tr style="background-color: lightblue;">
            <td>1</td>
            <td>Rahul</td>
            <td>21</td>
        </tr>

        <tr style="background-color:lightpink;">
            <td>2</td>
            <td>Priya</td>
            <td>22</td>
        </tr>

        <tr style="background-color: lightblue;">
            <td>3</td>
            <td>Jiya</td>
            <td>20</td>
        </tr>

        <tr style="background-color: lightpink;">
            <td>4</td>
            <td>James</td>
            <td>24</td>
        </tr>

    </table>

</body>

<h2>Odd&even</h2>

<table>
    <tr>
        <td style="background-color: orange;">1</td>
        <td style="background-color: yellow;">2</td>
        <td style="background-color: orange;">3</td>
        <td style="background-color: yellow;">4</td>
    </tr>

    <tr>
        <td style="background-color: orange;">5</td>
        <td style="background-color: yellow;">6</td>
        <td style="background-color: orange;">7</td>
        <td style="background-color: yellow;">8</td>
    </tr>
</table>

<h2>Order list</h2>

<h3>Fruits name</h3>

<ol type="1">
    <li>Apple</li>
    <li>Mango</li>
    <li>Banana</li>
    <li>Grapes</li>
</ol>

<h2>Unorder list</h2>
<h3>Flowers name</h3>

<ul>
    <li> Rose</li>
    <li> Sunflower</li>
    <li> Lily</li>
</ul>


</html>
