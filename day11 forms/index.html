<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: whitesmoke;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login_box {
            padding: 30px;
            border: 1px solid black;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            ;
        }

        .login_box h3 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form_group {
            margin-bottom: 15px;
        }

        .form_group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form_group input {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid grey;
            width: 100%;
        }

        .login_btn {
            width: 100%;
            padding: 10px;
            background-color: rgb(20, 19, 19);
            color: azure;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .forget_password {
            display: block;
            text-align: right;
            margin: 10px 2px 15px;
            text-decoration: none;
            color: black;
            font-size: 14px;

        }
    </style>
</head>

<body>
    <div class="login_box">
        <h3>Login</h3>
        <form action="">
            <div class="form_group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required />
            </div>

            <div class="form_group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required />
            </div>

            <div class="form_group">
                <a href="" class="forget_password">Forget password?</a>
                <button class="login_btn">Submit</button>
            </div>
        </form>
    </div>

</body>

</html>
