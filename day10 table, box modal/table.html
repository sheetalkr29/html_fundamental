<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            width: 80%;
            margin: 40px auto;
            border: 4px  double #222;
            border-spacing: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        th {
            background: #222;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th colspan="4">Product Information</th>
        </tr>
        <tr>
            <td class="product">I phone 17</td>
            <td><span class="description">Latest Apple Smart Phone</span></td>
            <td class="price">₹79,999</td>
            <td><span class="status">Available</span></td>
        </tr>
    </table>
    
</body>
</html>
