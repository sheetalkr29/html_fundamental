<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>

<body>

    <h1>Forms in HTML</h1>

    <form>
        <label for="fname">First Name</label>
        <input type="text" id="fname"> <br>

        <label for="lname">Last Name</label>
        <input type="text" id="lname"> <br>

        <label for="email">Email Address</label>
        <input type="text" id="email"> <br>

        <label for="Contact No">Contact No</label>
        <input type="number" id="Contact No"> <br>

        <p>Choose your domain</p>
        <input type="radio" id="html" name="domain">
        <label for="html">HTML</label> <br>

        <input type="radio" id="html" name="domain">
        <label for="html">CSS</label> <br>

        <input type="radio" name="domain" id="JS">
        <label for="html">JS</label> <br>

        <p>Choose your languages:</p>
        <input type="checkbox" id="HTML" name="lang">
        <label for="html"> HTML</label>

        <input type="checkbox" id="CSS" name="lang">
        <label for="CSS"> CSS</label>

        <input type="checkbox" id="JS" name="lang">
        <label for="JS"> JS</label> 
        
        <p>Select your preferable time:</p>

        <select name="time" id="time">
            <option value="11AM" 11 AM></option>
            <option value="12PM" 12 PM></option>
            <option value="1PM" 1 PM></option>
            <option value="2PM" 2 PM></option>
            <option value="3PM" 3 PM></option>
        </select>


        <br><br>

        <p>Please share your feedback:</p>
        <textarea name="area" id="area" cols="40" rows="10"></textarea>

        <br><br>

        <P>Choose color :</P>
        <input type="color">

        <br><br>

        <p>Upload your CV :</p>
        <input type="file">

        <br><br>

        <p>Upload your Image</p>
        <input type="image">

        <br><br>

        <input type="button" value="Sumbit">
        

    </form>

</body>

</html>
